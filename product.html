<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYRMEDON — Товар</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&amp;family=Rajdhani:wght@300;400;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles/main.css">
    <style>
        .product-page {
            display: flex;
            gap: 50px;
            padding: 40px 0 60px;
            flex-wrap: wrap;
        }

        .product-gallery {
            flex: 1 1 40%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 40px;
            text-align: center;
        }

        .product-gallery .main-image {
            font-size: 120px;
            display: block;
            margin-bottom: 20px;
        }

        .product-gallery .badge {
            display: inline-block;
            background: rgba(44, 62, 80, 0.08);
            color: var(--primary);
            padding: 4px 18px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid rgba(44, 62, 80, 0.08);
        }

        .product-info {
            flex: 1 1 45%;
        }

        .product-info .category {
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .product-info h1 {
            font-family: 'Playfair Display', serif;
            font-size: 38px;
            margin-bottom: 10px;
            color: var(--text);
        }

        .product-info .price {
            font-size: 36px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 16px;
        }

        .product-info .price .old {
            font-size: 22px;
            color: var(--text-muted);
            text-decoration: line-through;
            font-weight: 300;
            margin-right: 12px;
        }

        .product-info .description {
            color: var(--text-light);
            font-weight: 300;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 24px;
        }

        .product-info .specs {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 24px;
        }

        .product-info .specs .spec-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        .product-info .specs .spec-item:last-child {
            border-bottom: none;
        }

        .product-info .specs .spec-item .label {
            color: var(--text-muted);
            font-weight: 300;
        }

        .product-info .specs .spec-item .value {
            color: var(--text);
            font-weight: 600;
        }

        .product-info .btn-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .product-info .btn-group .btn {
            flex: 1;
            justify-content: center;
            min-width: 180px;
        }

        @media (max-width: 768px) {
            .product-page {
                flex-direction: column;
            }
            .product-gallery {
                padding: 30px 20px;
            }
            .product-gallery .main-image {
                font-size: 80px;
            }
            .product-info h1 {
                font-size: 30px;
            }
            .product-info .price {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">
                <div class="brand">MYR<span class="primary">MEDON</span></div>
                <div class="sub"><span class="primary">✦</span> INSPIRES <span class="primary">✦</span></div>
            </a>
            <button class="mobile-toggle" id="mobileToggle"><i class="fas fa-bars"></i></button>
            <nav class="nav" id="mainNav">
                <a href="index.html"><i class="fas fa-home"></i> Головна</a>
                <a href="catalog.html"><i class="fas fa-store"></i> Каталог</a>
                <a href="cart.html" class="cart-btn">
                    <i class="fas fa-shopping-cart"></i> Кошик
                    <span class="cart-count">0</span>
                </a>
                <a href="login.html"><i class="fas fa-user"></i> Вхід</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="product-page" id="productPage">
            <!-- Данные будут загружены через JavaScript -->
        </div>
    </div>

    <footer class="footer container">
        <div>
            <div class="brand-small">MYR<span class="primary">MEDON</span></div>
            <div class="sub-small"><span class="primary">✦</span> INSPIRES <span class="primary">✦</span></div>
            <p style="margin-top: 6px;">© 2026 Всі права захищено</p>
        </div>
        <div class="footer-links">
            <a href="index.html">Головна</a>
            <a href="catalog.html">Каталог</a>
            <a href="#">Про нас</a>
            <a href="#">Доставка</a>
            <a href="#">Контакти</a>
        </div>
        <div class="socials">
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-tiktok"></i></a>
            <a href="#"><i class="fab fa-youtube"></i></a>
            <a href="#"><i class="fab fa-telegram"></i></a>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script>
        // Данные товаров
        var productsData = {
            '1': {
                name: 'Camponotus japonicus',
                price: '299 ₴ – 559 ₴',
                oldPrice: null,
                emoji: '🐜',
                badge: null,
                category: 'Мурахи',
                description: 'Camponotus japonicus — велика та ефектна мураха зі Східної Азії. Відзначається спокійним характером, швидким ростом колонії та вираженим поліморфізмом робочих. Потребує мінімальних зусиль за доглядом.',
                specs: {
                    'Розмір робочих': '6–9 мм',
                    'Розмір солдат': '9–15 мм',
                    'Розмір матки': '16–18 мм',
                    'Температура': '25–28°C',
                    'Вологість': '~80%',
                    'Тривалість життя матки': '10–15 років'
                }
            },
            '2': {
                name: 'Camponotus pseudoirritans',
                price: '699 ₴ – 899 ₴',
                oldPrice: null,
                emoji: '🐜',
                badge: null,
                category: 'Мурахи',
                description: 'Ефектний вид з червоним черевцем. Відмінно підходить для середнього рівня досвіду. Колонія росте швидко і демонструє цікаву поведінку.',
                specs: {
                    'Розмір робочих': '5–8 мм',
                    'Розмір солдат': '8–12 мм',
                    'Розмір матки': '14–16 мм',
                    'Температура': '24–27°C',
                    'Вологість': '70–80%'
                }
            },
            '3': {
                name: 'Ectomomyrmex zhengii',
                price: '1 129 ₴',
                oldPrice: '1 490 ₴',
                emoji: '🐜',
                badge: '🔥 РОЗПРОДАЖ',
                category: 'Мурахи',
                description: 'Агресивні мисливці. Рідкісний вид для досвідчених кіперів. Відрізняються активною поведінкою та потужними щелепами.',
                specs: {
                    'Розмір робочих': '7–10 мм',
                    'Розмір матки': '12–14 мм',
                    'Температура': '26–29°C',
                    'Вологість': '80–90%'
                }
            },
            '4': {
                name: 'Messor structor',
                price: '490 ₴',
                oldPrice: null,
                emoji: '🐜',
                badge: null,
                category: 'Мурахи',
                description: 'Ідеальні для початківців. Жниварі. Збирають насіння, дуже цікаві для спостереження. Невибагливі у догляді.',
                specs: {
                    'Розмір робочих': '4–8 мм',
                    'Розмір матки': '10–12 мм',
                    'Температура': '22–26°C',
                    'Вологість': '40–50%'
                }
            },
            '5': {
                name: 'Camponotus vagus',
                price: '890 ₴',
                oldPrice: null,
                emoji: '🐜',
                badge: null,
                category: 'Мурахи',
                description: 'Чорні лісові велетні. Потужна колонія з великими робочими. Вражають своїми розмірами та силою.',
                specs: {
                    'Розмір робочих': '8–12 мм',
                    'Розмір матки': '16–18 мм',
                    'Температура': '22–26°C',
                    'Вологість': '60–70%'
                }
            },
            '6': {
                name: 'Atta cephalotes',
                price: '2 990 ₴',
                oldPrice: null,
                emoji: '🐜',
                badge: '⭐ НОВИНКА',
                category: 'Мурахи',
                description: 'Мурахи-листорізи. Екзотика для просунутих. Вирощують гриби з листя. Дуже складна соціальна структура.',
                specs: {
                    'Розмір робочих': '2–14 мм',
                    'Розмір матки': '20–25 мм',
                    'Температура': '25–28°C',
                    'Вологість': '85–95%'
                }
            }
        };

        // Загрузка товара
        document.addEventListener('DOMContentLoaded', function() {
            var params = new URLSearchParams(window.location.search);
            var id = params.get('id');

            if (!id || !productsData[id]) {
                document.getElementById('productPage').innerHTML = '<div style="text-align: center; padding: 60px 0;"><h2 style="font-family: Playfair Display, serif; color: var(--text);">Товар не знайдено</h2><p style="color: var(--text-muted);">Перейдіть до <a href="catalog.html" style="color: var(--primary);">каталогу</a></p></div>';
                return;
            }

            var product = productsData[id];
            var isSale = product.oldPrice;
            var specsHtml = '';
            var specKeys = Object.keys(product.specs);
            for (var i = 0; i < specKeys.length; i++) {
                var key = specKeys[i];
                var value = product.specs[key];
                specsHtml += '<div class="spec-item"><span class="label">' + key + '</span><span class="value">' + value + '</span></div>';
            }

            var badgeHtml = '';
            if (product.badge) {
                badgeHtml = '<div class="badge">' + product.badge + '</div>';
            }

            var oldPriceHtml = '';
            if (isSale) {
                oldPriceHtml = '<span class="old">' + product.oldPrice + '</span>';
            }

            document.getElementById('productPage').innerHTML = '<div class="product-gallery"><span class="main-image">' + product.emoji + '</span>' + badgeHtml + '</div><div class="product-info"><div class="category">' + product.category + '</div><h1>' + product.name + '</h1><div class="price">' + oldPriceHtml + product.price + '</div><div class="description">' + product.description + '</div><div class="specs">' + specsHtml + '</div><div class="btn-group"><button class="btn btn-primary" onclick="addToCart(\'' + id + '\')"><i class="fas fa-cart-plus"></i> Додати в кошик</button><a href="catalog.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Назад</a></div></div>';
        });
    </script>

</body>
</html>
